
name: Build Berk Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project BerkKeyboard.xcodeproj \
            -scheme BerkKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Inspect built app
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/BerkKeyboard.app"
          echo "APP CONTENTS:"
          find "$APP_PATH" -maxdepth 4 -print
          echo "APP SIZE:"
          du -sh "$APP_PATH"
          echo "KEYBOARD EXTENSIONS:"
          find "$APP_PATH" -type d -name "*.appex" -print
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BerkKeyboard.app Payload/
          cd Payload/..
          zip -r BerkKeyboard.ipa Payload
      - name: Verify IPA
        run: |
          echo "IPA FILE SIZE:"
          ls -lh BerkKeyboard.ipa
          echo "IPA CONTENTS:"
          unzip -l BerkKeyboard.ipa
          echo "IPA INTEGRITY:"
          unzip -t BerkKeyboard.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BerkKeyboard-IPA
          path: BerkKeyboard.ipa
